<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set New Password — Skilled-Creatives International Limited</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --blue:#0A3D91;
    --blue-deep:#072a66;
    --ink:#0B0F1A;
    --white:#FFFFFF;
    --orange:#F2921D;
    --cloud:#F5F7FB;
    --slate:#5B6472;
    --line:#E3E7EF;
    --display: 'Space Grotesk', sans-serif;
    --body: 'IBM Plex Sans', sans-serif;
    --mono: 'IBM Plex Mono', monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{font-family:var(--body);color:var(--ink);background:var(--cloud);line-height:1.6;overflow-x:hidden;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  img,svg{display:block;max-width:100%;}
  a{color:inherit;text-decoration:none;}
  h1{font-family:var(--display);font-weight:600;line-height:1.15;letter-spacing:-0.01em;}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--orange);font-weight:500;}
  :focus-visible{outline:2px solid var(--orange);outline-offset:3px;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;scroll-behavior:auto !important;}
  }

  .card{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:36px;}
  .logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:16px;color:var(--blue);margin-bottom:24px;}
  .logo-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--blue),var(--blue-deep));display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--mono);font-size:12px;flex:none;}
  h1{font-size:22px;margin-bottom:6px;}
  .sub{color:var(--slate);font-size:14px;margin-bottom:24px;}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;color:var(--ink);}
  .field-input-wrap{position:relative;}
  .field input{width:100%;padding:12px 14px;border-radius:9px;border:1px solid var(--line);font-family:var(--body);font-size:14px;background:#fff;}
  .field input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(10,61,145,0.12);}
  .field small{display:block;margin-top:6px;font-size:11.5px;color:var(--slate);}
  .pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--slate);font-size:11.5px;font-family:var(--mono);font-weight:500;}
  .pw-toggle:hover{color:var(--blue);}

  .btn{width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:9px;font-size:14.5px;font-weight:600;border:1px solid transparent;cursor:pointer;transition:transform .15s,box-shadow .15s,opacity .2s;font-family:var(--body);}
  .btn:hover{transform:translateY(-1px);}
  .btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}
  .btn-primary{background:var(--orange);color:#1a1200;box-shadow:0 6px 16px -6px rgba(242,146,29,0.6);}
  .btn-primary:hover:not(:disabled){box-shadow:0 10px 22px -6px rgba(242,146,29,0.7);}
  .spinner{width:15px;height:15px;border-radius:50%;border:2px solid rgba(0,0,0,0.2);border-top-color:#1a1200;animation:spin .7s linear infinite;display:none;}
  .btn.loading .spinner{display:inline-block;}
  .btn.loading .btn-label{opacity:.7;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .alert{border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:18px;display:none;gap:8px;align-items:flex-start;}
  .alert.show{display:flex;}
  .alert.error{background:#FDECEC;color:#B42318;border:1px solid #F6C6C2;}
  .alert.success{background:#E8F6EE;color:#0F6D3B;border:1px solid #BDE8CE;}
  .alert svg{width:16px;height:16px;flex:none;margin-top:1px;}

  .login-link{text-align:center;font-size:13.5px;color:var(--slate);margin-top:20px;}
  .login-link a{color:var(--blue);font-weight:600;}
  .login-link a:hover{text-decoration:underline;}
</style>
</head>
<body>

<div class="card">
  <div class="logo"><span class="logo-mark">SC</span>Skilled-Creatives Intl.</div>

  <div class="alert error" id="errorAlert">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>
    <span id="errorText"></span>
  </div>
  <div class="alert success" id="successAlert">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>
    <span id="successText"></span>
  </div>

  <div id="formWrap">
    <h1>Set a new password</h1>
    <p class="sub">Choose a new password for your account.</p>
    <form id="resetForm">
      <div class="field">
        <label for="new-password">New Password</label>
        <div class="field-input-wrap">
          <input type="password" id="new-password" placeholder="••••••••" required minlength="8" autocomplete="new-password">
          <button type="button" class="pw-toggle" data-target="new-password">SHOW</button>
        </div>
        <small>At least 8 characters.</small>
      </div>
      <div class="field">
        <label for="confirm-password">Confirm Password</label>
        <div class="field-input-wrap">
          <input type="password" id="confirm-password" placeholder="••••••••" required minlength="8" autocomplete="new-password">
          <button type="button" class="pw-toggle" data-target="confirm-password">SHOW</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" id="resetBtn">
        <span class="spinner"></span><span class="btn-label">Update Password</span>
      </button>
    </form>
  </div>

  <p class="login-link">Back to <a href="auth.html">Log In</a></p>
</div>
<!-- Load Supabase before the reset-password script -->
<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  crossorigin="anonymous">
</script>

<script>
(() => {
  'use strict';

  if (document.readyState === 'loading') {
    document.addEventListener(
      'DOMContentLoaded',
      initialiseResetPassword,
      { once: true }
    );
  } else {
    initialiseResetPassword();
  }

  async function initialiseResetPassword() {
    /* =========================================================
       SUPABASE CONFIG
       ========================================================= */
    const SUPABASE_URL =
      'https://aezepgnnykxqitzhhmen.supabase.co';

    const SUPABASE_ANON_KEY =
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFlemVwZ25ueWt4cWl0emhobWVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2MDUwNTYsImV4cCI6MjEwMzE4MTA1Nn0.Ds9Vhp0ula5JxH5mZ-YVoEWQji2bNXuuzGYo_lInwDI';

    const LOGIN_URL =
      new URL('./auth.html', window.location.href).href;

    const RECOVERY_STORAGE_KEY =
      'runambiz-password-recovery';

    /* =========================================================
       DOM ELEMENTS
       ========================================================= */
    const byId = id => document.getElementById(id);

    const errorAlert = byId('errorAlert');
    const errorText = byId('errorText');
    const successAlert = byId('successAlert');
    const successText = byId('successText');
    const formWrap = byId('formWrap');
    const resetForm = byId('resetForm');
    const resetButton = byId('resetBtn');

    function clearAlerts() {
      errorAlert?.classList.remove('show');
      successAlert?.classList.remove('show');
    }

    function showError(message) {
      clearAlerts();

      if (errorText) {
        errorText.textContent = message;
      }

      if (errorAlert) {
        errorAlert.classList.add('show');
        errorAlert.setAttribute('role', 'alert');
      }

      console.error(message);
    }

    function showSuccess(message) {
      clearAlerts();

      if (successText) {
        successText.textContent = message;
      }

      if (successAlert) {
        successAlert.classList.add('show');
        successAlert.setAttribute('role', 'status');
      }
    }

    function setLoading(button, loading) {
      if (!button) return;

      button.disabled = loading;
      button.classList.toggle('loading', loading);
      button.setAttribute('aria-busy', String(loading));
    }

    function setFormEnabled(enabled) {
      if (!resetForm) return;

      resetForm
        .querySelectorAll('input, button')
        .forEach(element => {
          element.disabled = !enabled;
        });

      formWrap?.setAttribute(
        'aria-busy',
        String(!enabled)
      );
    }

    function hideForm() {
      if (formWrap) {
        formWrap.style.display = 'none';
      }
    }

    function showForm() {
      if (formWrap) {
        formWrap.style.removeProperty('display');
      }

      setFormEnabled(true);

      window.requestAnimationFrame(() => {
        byId('new-password')?.focus();
      });
    }

    function getFriendlyError(error, fallback) {
      const message = error?.message || fallback;
      const lowerMessage = message.toLowerCase();

      if (
        lowerMessage.includes('failed to fetch') ||
        lowerMessage.includes('networkerror')
      ) {
        return 'Could not connect to Supabase. Check your internet connection.';
      }

      if (
        lowerMessage.includes('expired') ||
        lowerMessage.includes('invalid token') ||
        lowerMessage.includes('session missing')
      ) {
        return 'This reset link is invalid or has expired. Please request a new one.';
      }

      if (lowerMessage.includes('same password')) {
        return 'Your new password must be different from your old password.';
      }

      if (lowerMessage.includes('password should be')) {
        return 'Your password does not meet the required security rules.';
      }

      if (lowerMessage.includes('rate limit')) {
        return 'Too many attempts. Please wait a few minutes and try again.';
      }

      return message;
    }

    function saveRecoveryFlag() {
      try {
        window.sessionStorage.setItem(
          RECOVERY_STORAGE_KEY,
          'true'
        );
      } catch (error) {
        console.warn(
          'Session storage is unavailable:',
          error
        );
      }
    }

    function hasRecoveryFlag() {
      try {
        return (
          window.sessionStorage.getItem(
            RECOVERY_STORAGE_KEY
          ) === 'true'
        );
      } catch {
        return false;
      }
    }

    function removeRecoveryFlag() {
      try {
        window.sessionStorage.removeItem(
          RECOVERY_STORAGE_KEY
        );
      } catch {
        // Storage may be blocked by the browser.
      }
    }

    /* =========================================================
       PAGE VALIDATION
       ========================================================= */
    if (!resetForm) {
      showError(
        'Page setup error: the reset form could not be found.'
      );
      return;
    }

    setFormEnabled(false);

    if (
      !window.supabase ||
      typeof window.supabase.createClient !== 'function'
    ) {
      showError(
        'Supabase could not load. Check your internet connection and make sure the Supabase CDN script comes first.'
      );

      hideForm();
      return;
    }

    let supabaseClient;

    try {
      supabaseClient =
        window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_ANON_KEY,
          {
            auth: {
              persistSession: true,
              autoRefreshToken: true,
              detectSessionInUrl: true
            }
          }
        );
    } catch (error) {
      showError(
        getFriendlyError(
          error,
          'Could not initialise Supabase.'
        )
      );

      hideForm();
      return;
    }

    /* =========================================================
       PASSWORD SHOW/HIDE
       ========================================================= */
    document
      .querySelectorAll('.pw-toggle')
      .forEach(button => {
        button.addEventListener('click', event => {
          event.preventDefault();

          const input = byId(button.dataset.target);

          if (!(input instanceof HTMLInputElement)) {
            showError(
              'The password input could not be found.'
            );
            return;
          }

          const shouldShow =
            input.type === 'password';

          input.type =
            shouldShow ? 'text' : 'password';

          button.textContent =
            shouldShow ? 'HIDE' : 'SHOW';

          button.setAttribute(
            'aria-label',
            shouldShow
              ? 'Hide password'
              : 'Show password'
          );
        });
      });

    /* =========================================================
       CHECK RESET LINK
       ========================================================= */
    const searchParameters =
      new URLSearchParams(window.location.search);

    const hashParameters =
      new URLSearchParams(
        window.location.hash.slice(1)
      );

    const redirectError =
      searchParameters.get('error_description') ||
      hashParameters.get('error_description');

    const redirectErrorCode =
      searchParameters.get('error_code') ||
      hashParameters.get('error_code');

    const hasRecoveryParameters =
      searchParameters.has('code') ||
      searchParameters.get('type') === 'recovery' ||
      hashParameters.get('type') === 'recovery' ||
      hashParameters.has('access_token');

    if (redirectError || redirectErrorCode) {
      removeRecoveryFlag();
      hideForm();

      showError(
        redirectError ||
        'This password-reset link is invalid or has expired.'
      );

      return;
    }

    if (hasRecoveryParameters) {
      saveRecoveryFlag();
    }

    let recoverySessionReady = false;

    function allowPasswordReset() {
      if (recoverySessionReady) return;

      recoverySessionReady = true;
      saveRecoveryFlag();
      clearAlerts();
      showForm();
    }

    function rejectPasswordReset(message) {
      recoverySessionReady = false;
      removeRecoveryFlag();
      hideForm();
      showError(message);
    }

    /*
     * Supabase emits PASSWORD_RECOVERY after processing
     * the access token from the reset email.
     */
    const {
      data: authListener
    } = supabaseClient.auth.onAuthStateChange(
      (event, session) => {
        if (
          event === 'PASSWORD_RECOVERY' &&
          session
        ) {
          allowPasswordReset();
        }
      }
    );

    window.addEventListener(
      'pagehide',
      () => {
        authListener?.subscription?.unsubscribe();
      },
      { once: true }
    );

    try {
      /*
       * getSession waits for Supabase to finish processing
       * the recovery token.
       */
      const {
        data: sessionData,
        error: sessionError
      } = await supabaseClient.auth.getSession();

      if (sessionError) {
        throw sessionError;
      }

      const recoveryWasStarted =
        hasRecoveryParameters ||
        hasRecoveryFlag();

      if (
        sessionData?.session &&
        recoveryWasStarted
      ) {
        allowPasswordReset();
      } else if (!recoverySessionReady) {
        rejectPasswordReset(
          'No valid password-reset session was found. Please request a new reset link from the login page.'
        );
      }
    } catch (error) {
      rejectPasswordReset(
        getFriendlyError(
          error,
          'This reset link is invalid or has expired. Please request a new one.'
        )
      );
    }

    /* =========================================================
       UPDATE PASSWORD
       ========================================================= */
    resetForm.addEventListener(
      'submit',
      async event => {
        event.preventDefault();
        clearAlerts();

        if (!recoverySessionReady) {
          showError(
            'Your password-reset session is invalid or has expired. Please request a new reset link.'
          );
          return;
        }

        const passwordInput =
          byId('new-password');

        const confirmPasswordInput =
          byId('confirm-password');

        if (
          !(passwordInput instanceof HTMLInputElement) ||
          !(confirmPasswordInput instanceof HTMLInputElement)
        ) {
          showError(
            'Page setup error: the password fields could not be found.'
          );
          return;
        }

        const password = passwordInput.value;
        const confirmPassword =
          confirmPasswordInput.value;

        if (password.length < 8) {
          showError(
            'Password must be at least 8 characters.'
          );
          passwordInput.focus();
          return;
        }

        if (password !== confirmPassword) {
          showError('Passwords do not match.');
          confirmPasswordInput.focus();
          return;
        }

        setLoading(resetButton, true);

        try {
          const { error } =
            await supabaseClient.auth.updateUser({
              password
            });

          if (error) throw error;

          removeRecoveryFlag();
          recoverySessionReady = false;

          /*
           * Remove the temporary recovery session so the
           * user can log in normally with the new password.
           */
          const { error: signOutError } =
            await supabaseClient.auth.signOut({
              scope: 'local'
            });

          if (signOutError) {
            console.warn(
              'Password changed, but local sign-out returned:',
              signOutError.message
            );
          }

          resetForm.reset();
          hideForm();

          showSuccess(
            'Password updated successfully! Redirecting you to log in...'
          );

          window.setTimeout(() => {
            window.location.replace(LOGIN_URL);
          }, 1500);
        } catch (error) {
          showError(
            getFriendlyError(
              error,
              'Could not update your password. The reset link may have expired.'
            )
          );
        } finally {
          setLoading(resetButton, false);
        }
      }
    );
  }
})();
</script>

</body>
</html>
